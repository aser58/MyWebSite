<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="stylesheet" href="css/styles.css" />

    <style>
      /* =========================
   General
   ========================= */

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #eef2f7;
        color: #222;
      }

      #container {
        width: 90%;
        max-width: 1100px;
        margin: 30px auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        overflow: hidden;
      }

      /* =========================
   Header
   ========================= */

      #heder {
        background: linear-gradient(135deg, #008080, #005f73);
        color: white;
        text-align: center;
        padding: 25px 20px;
      }

      #heder h1 {
        margin: 0 0 10px;
        font-size: 36px;
      }

      #heder h3 {
        margin: 0;
        font-size: 20px;
        font-weight: normal;
      }

      /* =========================
   Navigation
   ========================= */

      #nav {
        background: #222;
        text-align: center;
        padding: 15px;
      }

      #nav a {
        color: white;
        text-decoration: none;
        font-size: 18px;
        font-weight: bold;
        margin: 0 10px;
        transition: color 0.2s ease;
      }

      #nav a:hover {
        color: #00ced1;
      }

      /* =========================
   Content
   ========================= */

      #container > h1 {
        text-align: center;
        color: #005f73;
        margin: 30px 0 10px;
        font-size: 32px;
      }

      /* =========================
   Form
   ========================= */

      form {
        width: 90%;
        max-width: 700px;
        margin: 25px auto 40px;
        padding: 30px;
        background: #f8fafc;
        border: 1px solid #d9e2ec;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);

        font-size: 18px;
      }

      /* Labels */

      form label {
        display: inline-block;
        margin-bottom: 7px;
        color: #333;
        font-weight: bold;
      }

      /* Text inputs */

      form input[type="text"],
      form input[type="email"],
      form input[type="tel"],
      form select,
      form textarea {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;

        border: 1px solid #b8c4ce;
        border-radius: 6px;

        font-family: inherit;
        font-size: 17px;

        background: white;

        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      /* Focus */

      form input[type="text"]:focus,
      form input[type="email"]:focus,
      form input[type="tel"]:focus,
      form select:focus,
      form textarea:focus {
        outline: none;
        border-color: #008080;
        box-shadow: 0 0 0 3px rgba(0, 128, 128, 0.15);
      }

      /* Radio buttons */

      form input[type="radio"] {
        margin: 0 5px 15px 15px;
        transform: scale(1.2);
      }

      /* Textarea */

      form textarea {
        resize: vertical;
        min-height: 120px;
      }

      /* Submit button */

      form input[type="submit"] {
        display: block;
        width: 180px;
        margin: 20px auto 0;

        padding: 12px 20px;

        border: none;
        border-radius: 7px;

        background: #008080;
        color: white;

        font-family: inherit;
        font-size: 18px;
        font-weight: bold;

        cursor: pointer;

        transition:
          background 0.2s ease,
          transform 0.15s ease,
          box-shadow 0.2s ease;
      }

      form input[type="submit"]:hover {
        background: #006666;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        transform: translateY(-2px);
      }

      form input[type="submit"]:active {
        transform: translateY(0);
      }

      /* =========================
   Footer
   ========================= */

      #footer {
        background: #222;
        color: white;
        text-align: center;
        padding: 20px;
      }

      #footer h3 {
        margin: 0 0 10px;
      }

      #footer p {
        margin: 5px 0;
      }

      #footer span {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <!-- heder -->

      <div id="heder">
        <h1>My First Page</h1>
        <h3>This is H3</h3>
      </div>
      <!-- heder end -->

      <!-- Nav -->
      <div id="nav">
        <a href="index.html">Home</a> | <a href="about.html">About</a> |
        <a href="contact.html">Contact</a>
      </div>
      <!-- Nav end -->

      <!-- content -->
      <h1>Contact Page</h1>

      <form action="get_data.html" method="get">
        <label for="firstname">First Name</label>
        <input type="text" name="firstname" id="firstname" />

        <br />
        <label for="lastname">Last Name</label>
        <input type="text" name="lastname" id="lastname" />

        <br />
        <label for="email">eMail Address</label>
        <input type="email" name="email" id="email" />

        <br />
        <label for="phone">Phone Number</label>
        <input type="tel" name="phone" id="phone" />

        <br />
        <label>Gender</label>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="male" value="male" />
        <label for="female">FeMale</label>
        <input type="radio" name="gender" id="female" value="female" />

        <br />
        <label for="reasons">Select Reason for Contact:</label>
        <br />
        <select id="reasons" name="reasons">
          <option value="complain">Complain</option>
          <option value="cuery">Query</option>
          <option value="other">Other</option>
        </select>

        <br />
        <label for="comments">Comments</label><br />
        <textarea
          type="text"
          name="comments"
          id="comments"
          rows="5"
          cols="25"
        ></textarea>

        <br />

        <input type="submit" />
      </form>
      <!-- content end -->

      <!-- fotter -->
      <div id="footer">
        <h3>This is H3 in div</h3>
        <p>This is p in div</p>
        <sp>This is span in div</sp>
      </div>
      <!-- fotter end -->
    </div>
  </body>
</html>
